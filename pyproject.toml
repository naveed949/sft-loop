[project]
name = "sft-loop"
version = "0.0.1"
description = "Same-seed <=3B TRL + PEFT LoRA SFT loop. MPS scored path does not use Unsloth. Fail-closed when the device or train dependencies are unavailable."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "jsonschema>=4.18",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]
train = [
  "torch>=2.2",
  "transformers>=4.56.1",
  "accelerate>=1.4.0",
  "datasets>=3.0.0",
  "peft>=0.8.0",
  "trl==0.24.0",
]
unsloth = [
  "unsloth==2026.9.12",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
