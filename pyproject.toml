[project]
name = "sft-loop"
version = "0.0.1"
description = "Same-seed <=3B Unsloth/TRL PEFT SFT loop. Fail-closed when the stack cannot train."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "jsonschema>=4.18",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]
train = [
  "unsloth==2026.9.12",
  "trl==0.24.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
